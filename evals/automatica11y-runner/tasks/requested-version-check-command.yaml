id: runner-requested-version-check-command
name: Explicit version-check request invokes runner skill
description: A user already directed the assistant to automatica11y and requests the first setup command without running it.
tags:
  - requested-version-check
inputs:
  prompt: "I've already been asked to use automatica11y. I have a local static site. Before anything else, give me the exact command that checks the tool version. Show it in a code block. Don't run anything yet."
expected:
  should_trigger: true
graders:
  - type: trigger
    name: triggers-runner-skill
    config:
      skill_path: "skills/automatica11y-runner/SKILL.md"
      mode: positive
      threshold: 0.6
  - type: text
    name: gives-version-check
    config:
      regex_match:
        - "automatica11y(@latest)? --version"