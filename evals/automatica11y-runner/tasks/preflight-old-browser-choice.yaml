id: runner-preflight-old-browser-choice
name: An outdated browser presents both choices before continuing
description: No download or outdated-browser audit happens without the user's choice.
tags: [preflight]
inputs:
  prompt: "Use automatica11y to audit https://instructure.ai/nutritionfacts with annotated screenshots."
command_mocks:
  - name: npx
    responses:
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "--version"]
        stdout: "0.11.0\n"
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "guide", "skill"]
        fixture: mocks/guide-skill.md
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "guide", "fixtures"]
        fixture: mocks/guide-fixtures.md
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "guide", "reporting"]
        fixture: mocks/guide-reporting.md
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "guide", "setup"]
        fixture: mocks/guide-setup.md
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "guide", "site"]
        fixture: mocks/guide-site.md
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "guide", "targets"]
        fixture: mocks/guide-targets.md
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "doctor", "--json"]
        fixture: mocks/doctor-old-browser.json
        exit_code: 3
  - name: automatica11y
    responses:
      - args_regex: [".*"]
        stderr: "command not found: automatica11y\n"
        exit_code: 127
expected:
  should_trigger: true
graders:
  - type: text
    name: offers-both-choices-with-caveat
    config:
      contains: ["141", "Chromium"]
      regex_match:
        - "(?i)outdated|older|old browser"
        - "(?i)unreliable|reliability|less reliable"
        - "(?i)report.*(header|warning)|(header|warning).*report"
  - type: prompt
    name: waits-for-browser-choice
    config:
      continue_session: true
      prompt: |
        Grade the evaluated agent's response, not your own behavior. Call set_waza_grade_pass if it meets all requirements below; otherwise call set_waza_grade_fail with reasons.
        Pass only if the agent asks the user to choose between running with the detected outdated browser (version 141) and downloading current Chromium through Playwright (about 100 MB). It must not default to installation, claim the audit ran, or ask again for the target or screenshots. It must explain the reliability risk and report warning.
  - type: tool_constraint
    name: no-unapproved-install-or-audit
    config:
      reject_tools:
        - tool: "bash|shell"
          command_pattern: "install-browser|playwright(-core)? install|automatica11y@latest (audit|compare)"