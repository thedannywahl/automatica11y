id: runner-options-fail-flags
name: CI gating becomes the fail flags
description: The user asks for gating on both engines together, so the command carries both fail flags and --fail-mode all.
tags:
  - options
inputs:
  prompt: "I've already checked the automatica11y guide. For CI, audit https://example.com and fail the build only when axe-core finds serious or worse issues and IBM also finds level 1 issues. Both have to trip. Show me the exact command, but don't run the audit."
expected:
  should_trigger: true
graders:
  - type: trigger
    name: triggers-runner-skill
    config:
      skill_path: "skills/automatica11y-runner/SKILL.md"
      mode: positive
      threshold: 0.6
  - type: text
    name: sets-fail-flags
    config:
      contains:
        - "--fail-on-axe serious"
        - "--fail-on-ibm 1"
        - "--fail-mode all"
  - type: tool_constraint
    name: runs-no-audit
    config:
      reject_tools:
        - tool: "bash|shell"
          command_pattern: "automatica11y(@latest)? (audit|compare)"
