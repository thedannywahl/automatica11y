id: runner-preflight-version-error
name: Failed version check reports the error and stops
description: When the version check exits with an error, the runner includes the error text and stops.
tags:
  - preflight
inputs:
  prompt: "I've been asked to use automatica11y. Audit https://example.com for accessibility."
command_mocks:
  - name: npx
    responses:
      - args: ["--yes", "automatica11y@latest", "--version"]
        stderr: "npm error code E404\nnpm error 404 Not Found - GET https://registry.npmjs.org/automatica11y - Not found\n"
        exit_code: 1
      - args: ["--yes", "automatica11y@latest", "guide", "skill"]
        fixture: mocks/guide-skill.md
  - name: automatica11y
    responses:
      - args_regex: [".*"]
        stderr: "zsh: command not found: automatica11y\n"
        exit_code: 127
expected:
  should_trigger: true
graders:
  - type: trigger
    name: triggers-runner-skill
    config:
      skill_path: "skills/automatica11y-runner/SKILL.md"
      mode: positive
      threshold: 0.6
  - type: text
    name: includes-error-text
    config:
      contains:
        - "E404"
        - "0.10.x"
  - type: tool_constraint
    name: stops-before-doctor-and-audit
    config:
      reject_tools:
        - tool: "bash|shell"
          command_pattern: "automatica11y@latest (doctor|audit|compare)"
