id: runner-preflight-old-browser-install-declined
name: Declining fallback after a failed download stops the audit
description: The runner offers fallback but respects refusal instead of auditing with an old browser.
tags: [preflight]
inputs:
  prompt: "Use automatica11y to audit https://instructure.ai/nutritionfacts with annotated screenshots. Yes, you can download Chromium if needed."
  responder:
    instructions: "If offered the outdated browser after the download failure, say no, do not use the outdated browser and do not run the audit. Do not authorize any other installer or network changes."
    max_followups: 2
command_mocks:
  - name: npx
    responses:
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "--version"]
        stdout: "0.10.1\n"
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "guide", "skill"]
        fixture: mocks/guide-skill.md
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "doctor", "--install-browser"]
        fixture: mocks/doctor-old-browser.txt
        stderr: "The Chromium download failed.\ngetaddrinfo ENOTFOUND cdn.playwright.dev\n"
        exit_code: 3
  - name: automatica11y
    responses:
      - args_regex: [".*"]
        stderr: "command not found: automatica11y\n"
        exit_code: 127
expected:
  should_trigger: true
graders:
  - type: tool_constraint
    name: no-audit-or-alternate-installer
    config:
      expect_tools:
        - tool: "bash|shell"
          command_pattern: "npx --yes --prefer-online automatica11y@latest doctor --install-browser"
      reject_tools:
        - tool: "bash|shell"
          command_pattern: "playwright(-core)? install|brew install|apt(-get)? install|automatica11y@latest (audit|compare)"
  - type: prompt
    name: offers-fallback-and-respects-refusal
    config:
      prompt: |
        Pass only if the agent reports ENOTFOUND cdn.playwright.dev, offers the detected outdated headless-shell 141 as a fallback, and respects the user's refusal. It must explicitly say the audit did not run and no results/report/screenshots were produced. It must not install via another route, retry installation, or present invented findings.