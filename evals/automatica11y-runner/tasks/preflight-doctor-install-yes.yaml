id: runner-preflight-doctor-install-yes
name: Agreeing to the download runs doctor --install-browser
description: When the user agrees to the Chromium download, the runner uses the tool's own installer and nothing else.
tags:
  - preflight
inputs:
  prompt: "I've been asked to use automatica11y. Get it ready to audit https://example.com, then show me the exact audit command. Don't run the audit itself."
  responder:
    instructions: "You want to audit https://example.com with automatica11y defaults. If you're asked whether to download Chromium, answer yes. Don't volunteer anything else. Abstain if asked about anything you can't infer from this."
    max_followups: 4
command_mocks:
  - name: npx
    responses:
      - args: ["--yes", "automatica11y@latest", "--version"]
        stdout: "0.10.0\n"
      - args: ["--yes", "automatica11y@latest", "guide", "skill"]
        fixture: mocks/guide-skill.md
      - args: ["--yes", "automatica11y@latest", "doctor", "--install-browser"]
        stdout: "Downloading Chromium (this can take a minute)...\nautomatica11y doctor\n  Node     24.22.0  ok\n  Browser  chromium-headless-shell 155.0.8059.80  ok\n           /Users/me/Library/Caches/ms-playwright/chromium_headless_shell-1200/chrome-mac/headless_shell\n"
      - args: ["--yes", "automatica11y@latest", "doctor"]
        fixture: mocks/doctor-no-browser.txt
        exit_code: 3
  - name: automatica11y
    responses:
      - args_regex: [".*"]
        stderr: "zsh: command not found: automatica11y\n"
        exit_code: 127
expected:
  should_trigger: true
graders:
  - type: trigger
    name: triggers-runner-skill
    config:
      skill_path: "skills/automatica11y-runner/SKILL.md"
      mode: positive
      threshold: 0.6
  - type: tool_constraint
    name: uses-the-tool-installer-only
    config:
      expect_tools:
        - tool: "bash|shell"
          command_pattern: "npx --yes automatica11y@latest doctor --install-browser"
      reject_tools:
        - tool: "bash|shell"
          command_pattern: "playwright(-core)? install|brew install|automatica11y@latest (audit|compare)"
  - type: text
    name: shows-audit-command
    config:
      regex_match:
        - "automatica11y(@latest)? audit https://example\\.com"
