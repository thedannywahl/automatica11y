id: runner-options-wcag
name: A named WCAG version becomes --wcag
description: The user names WCAG 2.1, so the command carries --wcag 2.1.
tags:
  - options
inputs:
  prompt: "I've already checked the automatica11y guide. Audit https://example.com against WCAG 2.1. Show me the exact command, but don't run the audit."
expected:
  should_trigger: true
graders:
  - type: trigger
    name: triggers-runner-skill
    config:
      skill_path: "skills/automatica11y-runner/SKILL.md"
      mode: positive
      threshold: 0.6
  - type: text
    name: sets-wcag
    config:
      contains:
        - "https://example.com"
        - "--wcag 2.1"
  - type: tool_constraint
    name: runs-no-audit
    config:
      reject_tools:
        - tool: "bash|shell"
          command_pattern: "automatica11y(@latest)? (audit|compare)"
