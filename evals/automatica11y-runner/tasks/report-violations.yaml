id: runner-report-violations
name: Report from results with violations
description: The runner writes the report from an existing results.json with violations from both engines, keeping the engines apart and using the tool's own words.
tags:
  - report
inputs:
  prompt: "I've been asked to use automatica11y. I already ran npx --yes automatica11y@latest audit ./missing-alt.html and the output is in ./a11y-report. Write up the accessibility report for me from those results. Don't run the tool again."
  context:
    fixture: fixtures/reports/violations
expected:
  should_trigger: true
graders:
  - type: trigger
    name: triggers-runner-skill
    config:
      skill_path: "skills/automatica11y-runner/SKILL.md"
      mode: positive
      threshold: 0.6
  - type: text
    name: quotes-results
    config:
      contains:
        - "image-alt"
        - "img_alt_valid"
        - "critical"
        - "0.9.0"
        - "simulated"
      regex_match:
        - "(?i)snapshot"
        - "1\\.1\\.1 Non-text Content"
      regex_not_match:
        - "(?i)\\b(is|are|was|be|fully) accessible\\b"
        - "(?i)\\bcompliant\\b"
        - "(?i)passes WCAG"
        - "\\b\\d{1,3}\\s*/\\s*100\\b"
  - type: prompt
    name: follows-report-rules
    config:
      prompt: |
        You are grading an accessibility report written from automatica11y results. One page was audited. axe-core reported one critical image-alt violation and IBM Equal Access reported one Toolkit level 1 img_alt_valid violation, both on the same image. The virtual screen reader flagged a bare "image" announcement.
        Pass only if all of these hold:
        1. The run date and tool versions come first, and the results are called a snapshot.
        2. axe-core and IBM findings are reported separately. Their counts are never added together, and axe impact is never converted into IBM levels or the other way round.
        3. Violations, needs-review items, and passes are kept in separate lists.
        4. The phrase "no automated violations found" is not used for either engine, since both reported a violation.
        5. Virtual screen reader output is labelled simulated.
        6. Conditions checks are in their own section, and "not applicable" results aren't presented as failures or passes.
        7. There is no single overall score, and the page is never called accessible or compliant.
        8. It ends with a method note naming what automated tools can't catch, such as whether alt text is meaningful and how real screen readers behave.
        Fail if any rule is broken or if any number in the report doesn't appear in the results.
  - type: tool_constraint
    name: does-not-rerun
    config:
      reject_tools:
        - tool: "bash|shell"
          command_pattern: "automatica11y(@latest)? (audit|compare)"
