name: automatica11y-runner-eval
description: Hermetic evaluation of the automatica11y runner skill. npx is mocked, so no task needs the network or a browser.
skill: automatica11y-runner
schemaVersion: "1.4"
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-5.5
metrics:
  - name: task_completion
    weight: 0.7
    threshold: 0.8
    description: Did the runner skill trigger for audit workflows and stay idle for unrelated requests?
  - name: efficiency
    weight: 0.3
    threshold: 0.7
    description: Did the runner skill stay within behavior limits?
command_mocks:
  - name: npx
    responses:
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "--version"]
        stdout: "0.10.1\n"
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "guide", "skill"]
        fixture: mocks/guide-skill.md
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "doctor"]
        fixture: mocks/doctor-ok.txt
  # A global install on the host must not change the outcome.
  - name: automatica11y
    responses:
      - args_regex: [".*"]
        stderr: "zsh: command not found: automatica11y\n"
        exit_code: 127
  - name: a11y
    responses:
      - args_regex: [".*"]
        stderr: "zsh: command not found: a11y\n"
        exit_code: 127
graders:
  - type: behavior
    name: token-budget
    config:
      max_tokens: 400000
tasks:
  - "tasks/*.yaml"