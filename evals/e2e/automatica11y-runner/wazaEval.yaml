name: automatica11y-runner-e2e
description: End-to-end evaluation of the automatica11y runner skill. Tasks run the real tool with npx, so they need the npm registry and Chrome or Chromium.
skill: automatica11y-runner
schemaVersion: "1.4"
version: "1.0"
config:
  trials_per_task: 1
  max_attempts: 2
  timeout_seconds: 900
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-5.5
metrics:
  - name: task_completion
    weight: 0.7
    threshold: 0.8
    description: Did the runner check the setup, run the tool, and write a report from its results?
  - name: efficiency
    weight: 0.3
    threshold: 0.7
    description: Did the runner stay within behavior limits?
hooks:
  before_run:
    - command: "mkdir -p fixtures/npm-local && npm pack ./fixtures/packages/widgets --pack-destination ./fixtures/npm-local --loglevel=error && cp fixtures/packages/widgets/README.md fixtures/npm-local/widgets-README.md"
      working_directory: "."
      exit_codes: [0]
      error_on_fail: true
graders:
  - type: behavior
    name: token-budget
    config:
      max_tokens: 400000
tasks:
  - "tasks/*.yaml"
