id: runner-e2e-compare-pages
name: Compare two local pages
description: The runner compares two local pages with one compare command and reports them side by side from results.json.
tags:
  - e2e
context_dir: evals/e2e/automatica11y-runner/fixtures/pages
inputs:
  prompt: "I've been asked to use automatica11y. Compare the accessibility of ./clean.html and ./missing-alt.html and write me the comparison. For IBM Equal Access, if it reports no violations, write 'IBM Equal Access reported no violations in this run' and list any needs-review items separately. End with a final reply stating the report path and summarizing both targets' findings."
  files:
    - path: clean.html
    - path: missing-alt.html
expected:
  should_trigger: true
graders:
  - type: file
    name: writes-results
    config:
      must_exist:
        - "a11y-report/results.json"
  - type: tool_constraint
    name: runs-one-compare
    config:
      expect_tools:
        - tool: "bash|shell"
          command_pattern: "automatica11y(@latest)? compare .*clean\\.html.*missing-alt\\.html|automatica11y(@latest)? compare .*missing-alt\\.html.*clean\\.html"
  - type: text
    name: quotes-results
    config:
      contains:
        - "image-alt"
        - "no automated violations found"
      regex_not_match:
        - "\\b\\d{1,3}\\s*/\\s*100\\b"
  - type: prompt
    name: follows-report-rules
    config:
      prompt: |
        You are grading an accessibility comparison of two local pages written from automatica11y results. One page is clean and the other has an image with no alt text.
        Pass only if: it says both targets used the same WCAG version, level, and rules; the coverage matrix precedes the findings (a title, run metadata, and settings may come first); axe-core and IBM Equal Access are reported separately and never added together; "no automated violations found" is used only for axe-core where it found zero violations for that target; and there is no single score or winner by number.
        For IBM with zero violations, say "IBM Equal Access reported no violations in this run" and list any needs-review items separately. Never accept "both engines found nothing" when either has needs-review items, and never accept "no automated violations found" attributed to IBM.
        Fail affirmative claims that a target is accessible, compliant, or passes WCAG. Do not fail quoted questions, negated claims, or method caveats such as "not fully accessible" or "cannot establish that the page is accessible."
