id: bootstrap-guide-other-failure
name: Registry failure stops when permission requests are unavailable
description: "Guide-failure scenario: the guide can't reach the registry, permission requests are unavailable, and Node is current, so the skill reports the error text and stops without guessing results."
tags:
  - guide-failure
inputs:
  prompt: "Run an accessibility check on https://example.com with automatica11y. Network permission requests are unavailable in this execution environment; don't attempt to request them or change permission settings."
command_mocks:
  - name: npx
    responses:
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "guide", "skill"]
        stderr: "npm error code ENOTFOUND\nnpm error network request to https://registry.npmjs.org/automatica11y failed, reason: getaddrinfo ENOTFOUND registry.npmjs.org\n"
        exit_code: 1
  - name: automatica11y
    responses:
      - args_regex: [".*"]
        stderr: "zsh: command not found: automatica11y\n"
        exit_code: 127
  - name: node
    responses:
      - args: ["--version"]
        stdout: "v24.22.0\n"
expected:
  should_trigger: true
graders:
  - type: trigger
    name: triggers-automatica11y-skill
    config:
      skill_path: "skills/automatica11y/SKILL.md"
      mode: positive
      threshold: 0.6
  - type: text
    name: no-invented-results
    config:
      contains:
        - "ENOTFOUND"
      regex_not_match:
        - "(?i)(no automated violations found|\\b\\d+\\s+(violations|findings|issues)\\b)"
        - "(?i)\\bWCAG\\s*(2\\.\\d|3\\.0)"
        - "(?i)\\b(score|rating)\\s*[:=]"
        - "(?i)\\b(is|are|was|be|fully) accessible\\b"
  - type: tool_constraint
    name: runs-no-audit
    config:
      reject_tools:
        - tool: "bash|shell"
          command_pattern: "automatica11y(@latest)? (audit|compare|doctor)"
