id: bootstrap-component-library-comparison
name: Component library comparison invokes bootstrap skill
description: A comparison of component libraries should invoke automatica11y and ask for the necessary target details.
tags:
  - component-library-comparison
inputs:
  prompt: "Compare React Aria and Headless UI. Do not run audits yet. Tell me what target details you need, and include the exact names React Aria and Headless UI in your reply."
command_mocks:
  - name: npx
    responses:
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "guide", "skill"]
        fixture: mocks/guide-skill.md
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "guide", "fixtures"]
        fixture: mocks/guide-fixtures.md
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "guide", "reporting"]
        fixture: mocks/guide-reporting.md
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "guide", "setup"]
        fixture: mocks/guide-setup.md
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "guide", "site"]
        fixture: mocks/guide-site.md
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "guide", "targets"]
        fixture: mocks/guide-targets.md
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "--version"]
        stdout: "0.11.0\n"
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "doctor", "--json"]
        fixture: mocks/doctor-ok.json
  - name: automatica11y
    responses:
      - args_regex: [".*"]
        stderr: "zsh: command not found: automatica11y\n"
        exit_code: 127
expected:
  should_trigger: true
graders:
  - type: trigger
    name: triggers-automatica11y-skill
    config:
      skill_path: "skills/automatica11y/SKILL.md"
      mode: positive
      threshold: 0.6
  - type: text
    name: follows-skill-steps
    config:
      contains:
        - "guide skill"
  - type: text
    name: covers-both-libraries
    config:
      contains:
        - "React Aria"
        - "Headless UI"