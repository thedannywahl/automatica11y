id: bootstrap-guide-etarget-retry
name: ETARGET retries once with --prefer-online
description: "Guide-failure scenario: the first guide fetch fails with ETARGET, so the skill retries once with --prefer-online, then follows the guide it gets."
tags:
  - guide-failure
inputs:
  prompt: "Run an accessibility check on https://example.com with automatica11y. Don't run the audit yet; show me the exact audit command."
command_mocks:
  - name: npx
    responses:
      - args: ["--yes", "automatica11y@latest", "guide", "skill"]
        stderr: "npm error code ETARGET\nnpm error notarget No matching version found for automatica11y@latest.\n"
        exit_code: 1
      - args: ["--yes", "--prefer-online", "automatica11y@latest", "guide", "skill"]
        fixture: mocks/guide-skill.md
      - args: ["--yes", "automatica11y@latest", "--version"]
        stdout: "0.10.1\n"
      - args: ["--yes", "automatica11y@latest", "doctor"]
        fixture: mocks/doctor-ok.txt
  - name: automatica11y
    responses:
      - args_regex: [".*"]
        stderr: "zsh: command not found: automatica11y\n"
        exit_code: 127
expected:
  should_trigger: true
graders:
  - type: trigger
    name: triggers-automatica11y-skill
    config:
      skill_path: "skills/automatica11y/SKILL.md"
      mode: positive
      threshold: 0.6
  - type: tool_constraint
    name: retries-with-prefer-online
    config:
      expect_tools:
        - tool: "bash|shell"
          command_pattern: "--prefer-online.*automatica11y@latest guide skill"
      reject_tools:
        - tool: "bash|shell"
          command_pattern: "automatica11y(@latest)? (audit|compare)"
  - type: text
    name: shows-audit-command
    config:
      regex_match:
        - "automatica11y(@latest)? audit https://example\\.com"
