id: bootstrap-component-accessibility-question
name: Component accessibility question invokes bootstrap skill
description: Asking about a component's accessibility should invoke automatica11y and request the missing target.
tags:
  - component-accessibility-request
inputs:
  prompt: "How accessible is the Radix Dialog component? Do not run an audit yet. First state the exact guide command you ran, then ask me which target I mean."
expected:
  should_trigger: true
graders:
  - type: trigger
    name: triggers-automatica11y-skill
    config:
      skill_path: "skills/automatica11y/SKILL.md"
      mode: positive
      threshold: 0.6
  - type: text
    name: follows-skill-steps
    config:
      contains:
        - "guide skill"