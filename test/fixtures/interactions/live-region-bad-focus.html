<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>live-region-bad-focus</title>
<style>button { min-width: 44px; min-height: 44px; } [hidden] { display: none !important; } </style>
</head>
<body>
<button type="button" id="go" data-a11y-trigger>Save</button>
<div id="box" role="alert" aria-live="polite" tabindex="-1" data-a11y-root></div>
<script>
document.getElementById('go').addEventListener('click', () => { const box = document.getElementById('box'); box.textContent = 'Saved.'; box.focus(); });
</script>
</body>
</html>
