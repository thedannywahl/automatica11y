<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tooltip-bad</title>
<style>button { min-width: 44px; min-height: 44px; } [hidden] { display: none !important; } </style>
</head>
<body>
<button type="button" id="b" data-a11y-trigger aria-describedby="tip" style="margin-bottom:60px">Help</button>
<span role="tooltip" id="tip" data-a11y-root hidden style="position:absolute;top:80px;left:0;background:#222;color:#fff;padding:6px 10px">Saves your work.</span>
<script>

const b = document.getElementById("b"), tip = document.getElementById("tip");
b.addEventListener("mouseenter", () => { tip.hidden = false; });
b.addEventListener("mouseleave", () => { tip.hidden = true; });
</script>
</body>
</html>
