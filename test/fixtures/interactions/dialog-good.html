<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dialog-good</title>
<style>button { min-width: 44px; min-height: 44px; } [hidden] { display: none !important; } </style>
</head>
<body>
<button type="button" id="open" data-a11y-trigger aria-haspopup="dialog" aria-expanded="false">Open</button>
<div role="dialog" aria-modal="true" aria-label="Edit profile" id="dlg" data-a11y-root hidden>
<p>Update your details.</p>
<button type="button" id="first">Save</button>
<button type="button" id="close">Close</button>
</div>
<script>

const open = document.getElementById("open"), dlg = document.getElementById("dlg");
const focusables = () => [...dlg.querySelectorAll("button")];
function close() { dlg.hidden = true; open.setAttribute("aria-expanded", "false"); open.focus(); }
open.onclick = () => { dlg.hidden = false; open.setAttribute("aria-expanded", "true"); focusables()[0].focus(); };
document.getElementById("close").onclick = close;
dlg.addEventListener("keydown", (e) => {
  if (e.key === "Escape") close();
  if (e.key === "Tab") {
    const list = focusables(), first = list[0], last = list[list.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
</script>
</body>
</html>
