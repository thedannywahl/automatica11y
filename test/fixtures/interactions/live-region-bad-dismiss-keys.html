<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>live-region-bad-dismiss-keys</title>
<style>button { min-width: 44px; min-height: 44px; } [hidden] { display: none !important; } </style>
</head>
<body>
<button type="button" id="go" data-a11y-trigger>Save</button>
<div id="slot"></div>
<script>
document.getElementById('go').addEventListener('click', () => {
  const box = document.createElement('div');
  box.setAttribute('role', 'alert');
  box.setAttribute('data-a11y-root', '');
  box.innerHTML = 'Could not save. <span role="button" tabindex="0" id="close">Dismiss</span>';
  document.getElementById('slot').append(box);
  box.querySelector('#close').addEventListener('mousedown', () => box.remove());
});
</script>
</body>
</html>
