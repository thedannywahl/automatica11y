<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>combobox-good</title>
<style>button { min-width: 44px; min-height: 44px; } [hidden] { display: none !important; } </style>
</head>
<body>
<label for="c">Fruit</label>
<input id="c" role="combobox" aria-expanded="false" aria-controls="lb" aria-autocomplete="list" data-a11y-trigger autocomplete="off">
<ul role="listbox" id="lb" data-a11y-root hidden>
<li role="option" id="o1">Apple</li>
<li role="option" id="o2">Banana</li>
<li role="option" id="o3">Cherry</li>
</ul>
<script>

const input = document.getElementById("c"), lb = document.getElementById("lb");
const opts = [...lb.querySelectorAll("[role=option]")];
let index = -1;
function open() { lb.hidden = false; input.setAttribute("aria-expanded", "true"); }
function close() { lb.hidden = true; input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-activedescendant"); index = -1; opts.forEach((o) => o.removeAttribute("aria-selected")); }
function move(n) { index = (n + opts.length) % opts.length; opts.forEach((o, i) => o.setAttribute("aria-selected", String(i === index))); input.setAttribute("aria-activedescendant", opts[index].id); }
input.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); if (lb.hidden) open(); else move(index + 1); }
  if (e.key === "ArrowUp") { e.preventDefault(); if (!lb.hidden) move(index - 1); }
  if (e.key === "Enter" && !lb.hidden && index >= 0) { e.preventDefault(); input.value = opts[index].textContent; close(); }
  if (e.key === "Escape") close();
});
</script>
</body>
</html>
