<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>menu-active-descendant-bad</title>
<style>button { min-width: 44px; min-height: 44px; } :focus { outline: 2px solid navy; } [hidden] { display: none !important; } [data-active] { background: #ddd; }</style>
</head>
<body>
<button type="button" id="trigger" data-a11y-trigger aria-haspopup="menu" aria-controls="actions" aria-expanded="false">Document actions</button>
<div role="menu" id="actions" data-a11y-root tabindex="-1" aria-labelledby="trigger" hidden>
<div role="menuitem" id="rename">Rename document</div>
<div role="menuitem" id="archive">Archive document</div>
<div role="menuitem" id="duplicate">Duplicate document</div>
</div>
<script>
const trigger = document.getElementById("trigger"), menu = document.getElementById("actions");
const items = [...menu.querySelectorAll("[role=menuitem]")];
let index = 0;
function move(next) {
  index = (next + items.length) % items.length;
  menu.setAttribute("aria-activedescendant", items[index].id);
  items.forEach((item, i) => item.toggleAttribute("data-active", i === index));
}
function open() { menu.hidden = false; trigger.setAttribute("aria-expanded", "true"); move(0); menu.focus(); }
function close() { menu.hidden = true; trigger.setAttribute("aria-expanded", "false"); trigger.focus(); }
trigger.onclick = open;
trigger.addEventListener("keydown", (event) => {
  if (event.key === "ArrowDown") { event.preventDefault(); open(); }
});
menu.addEventListener("keydown", (event) => {
  if (event.key === "ArrowDown") { event.preventDefault(); move(index + 1); }
  if (event.key === "ArrowUp") event.preventDefault();
  if (event.key === "Escape") { event.preventDefault(); close(); }
});
</script>
</body>
</html>
