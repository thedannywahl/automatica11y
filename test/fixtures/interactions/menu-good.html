<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>menu-good</title>
<style>button { min-width: 44px; min-height: 44px; } [hidden] { display: none !important; } </style>
</head>
<body>
<button type="button" id="btn" data-a11y-trigger aria-haspopup="menu" aria-expanded="false">Actions</button>
<div role="menu" id="menu" data-a11y-root hidden>
<button role="menuitem" type="button" tabindex="-1">Edit</button>
<button role="menuitem" type="button" tabindex="-1">Copy</button>
<button role="menuitem" type="button" tabindex="-1">Delete</button>
</div>
<script>

const btn = document.getElementById("btn"), menu = document.getElementById("menu");
const items = () => [...menu.querySelectorAll("[role=menuitem]")];
function open() { menu.hidden = false; btn.setAttribute("aria-expanded", "true"); items()[0].focus(); }
function close() { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); btn.focus(); }
btn.onclick = open;
btn.addEventListener("keydown", (e) => { if (e.key === "ArrowDown") { e.preventDefault(); open(); } });
menu.addEventListener("keydown", (e) => {
  const list = items(), i = list.indexOf(document.activeElement);
  if (e.key === "ArrowDown") { e.preventDefault(); list[(i + 1) % list.length].focus(); }
  if (e.key === "ArrowUp") { e.preventDefault(); list[(i - 1 + list.length) % list.length].focus(); }
  if (e.key === "Escape") close();
});
</script>
</body>
</html>
