<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>focus-tint-child</title>
<style>
body { margin: 24px; background: #fff; font: 16px/1.4 sans-serif; }
button, input { font: inherit; min-width: 44px; min-height: 44px; }
button { position: relative; color: #1a1a1a; background: #fff; border: 2px solid #1a1a1a; margin: 12px; } button:focus-visible { outline: none; } .tint { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.06); pointer-events: none; } button:focus-visible .tint { display: block; }
</style>
</head>
<body>
<button type="button" data-a11y-trigger data-a11y-root>Save<span class="tint"></span></button>
</body>
</html>
