<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>motion-fade-only</title>
<style>
body { margin: 16px; font: 16px/1.4 sans-serif; background: #fff; color: #222; }
button { font: inherit; min-width: 44px; min-height: 44px; }
#panel { opacity: 0; transition: opacity 300ms; } #panel.on { opacity: 1; }
</style>
</head>
<body>
<button type="button" id="go" data-a11y-trigger data-a11y-root>Save</button><div id="panel">Saved.</div>
<script>
document.getElementById('go').addEventListener('click', () => document.getElementById('panel').classList.add('on'));
</script>
</body>
</html>
