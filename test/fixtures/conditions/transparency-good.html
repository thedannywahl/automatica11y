<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>transparency-good</title>
<style>
body { margin: 16px; font: 16px/1.4 sans-serif; background: #fff; color: #222; }
button { font: inherit; min-width: 44px; min-height: 44px; }
.card { padding: 12px; margin-top: 12px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(8px); } @media (prefers-reduced-transparency: reduce) { .card { background: #fff; backdrop-filter: none; } }
</style>
</head>
<body>
<button type="button" id="go" data-a11y-trigger data-a11y-root>Save</button><div class="card">Saved.</div>
</body>
</html>
