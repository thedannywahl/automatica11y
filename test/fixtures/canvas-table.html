<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Canvas with a table</title>
</head>
<body>
<main>
<h1>Canvas with a table</h1>
<canvas id="c" width="300" height="150"></canvas>
<table><caption>Sales by quarter</caption><tr><th scope="col">Quarter</th><th scope="col">Sales</th></tr><tr><td>Q1</td><td>10</td></tr><tr><td>Q2</td><td>40</td></tr></table>
</main>
</body>
</html>
