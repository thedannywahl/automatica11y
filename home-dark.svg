<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="2.5" fill="#EC93C6" opacity="0.66"/>
    </pattern>
    <linearGradient id="fade">
      <stop stop-color="black"/>
      <stop offset="0.333" stop-color="black"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="mask" x="0" y="0" width="100%" height="100%" maskUnits="userSpaceOnUse">
      <rect width="100%" height="100%" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect width="100%" height="100%" fill="#26051A"/>
  <rect width="100%" height="100%" fill="url(#dots)" mask="url(#mask)"/>
</svg>