name: Latest dependencies

# The tool runs against the latest axe-core, IBM Equal Access, Playwright, and the rest.
# This job tests exactly that every week, and opens an issue when an upgrade breaks a test.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-package-lock
      - name: Install the latest of each tool
        run: >
          npm install --no-package-lock --no-save
          axe-core@latest @axe-core/playwright@latest accessibility-checker-engine@latest
          playwright-core@latest @guidepup/virtual-screen-reader@latest esbuild@latest valibot@latest
      - run: npx playwright-core install --with-deps --only-shell chromium
      - name: Record the versions
        run: npm ls --depth=0 | tee versions.txt
      - run: npm run lint
      - name: Run the tests
        id: tests
        run: npm test 2>&1 | tee test-output.txt
        continue-on-error: true
      - name: Open an issue if the tests failed
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --label latest-deps --state open --json number --jq '.[0].number // empty')
          {
            echo "The weekly run against the latest dependencies failed."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Versions installed:"
            echo '```'
            cat versions.txt
            echo '```'
            echo
            echo "Failing tests:"
            echo '```'
            grep -E '^(✖|not ok)' test-output.txt | head -30
            echo '```'
          } > body.md
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh label create latest-deps --color B60205 --description "An upgrade broke a test" 2>/dev/null || true
            gh issue create --title "Latest dependencies break the tests" --label latest-deps --body-file body.md
          fi
      - name: Fail the job if the tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
