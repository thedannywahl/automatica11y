name: Changesets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validation:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  version:
    name: Open or update version PR
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
      pr-number: ${{ steps.changesets.outputs.pr-number }}
    steps:
      - name: Require release credentials
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          RELEASE_ACTOR: ${{ vars.RELEASE_ACTOR }}
        run: |
          if [[ -z "$RELEASE_PAT" || -z "$RELEASE_ACTOR" ]]; then
            echo "::error::Configure RELEASE_PAT (repository Contents and Pull requests read/write) and RELEASE_ACTOR before releasing."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Create or update version PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run changeset:version
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"
          github-token: ${{ secrets.RELEASE_PAT }}
      - name: Enable checked auto-merge
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_ACTOR: ${{ vars.RELEASE_ACTOR }}
          PR: ${{ steps.changesets.outputs.pr-number }}
        run: |
          actual=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
            --jq '[.head.repo.full_name, .head.ref, .user.login, .title, .base.ref] | join("|")')
          expected="$GITHUB_REPOSITORY|changeset-release/main|$RELEASE_ACTOR|chore: release packages|main"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Refusing to auto-merge a PR outside the authenticated release flow."
            exit 1
          fi
          gh pr merge "$PR" --squash --auto --repo "$GITHUB_REPOSITORY"
          printf 'Version PR #%s is waiting for required checks.\n' "$PR" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish npm package and GitHub Release
    needs: [validation, version]
    if: needs.version.outputs.has-changesets == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check trusted-publishing CLI requirements
        run: |
          npm_version="$(npm --version)"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              throw new Error("npm " + process.argv[1] + " is too old for trusted publishing; need 11.5.1 or newer.");
            }
          ' "$npm_version"
      - name: Publish packages and create GitHub Releases
        id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: npm run release
          create-github-releases: true
          push-git-tags: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Record published documentation source
        if: steps.publish.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.publish.outputs.published-packages }}
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync, writeFileSync, appendFileSync } from "node:fs";
            import { join } from "node:path";
            const { name, version } = JSON.parse(readFileSync("package.json", "utf8"));
            const published = JSON.parse(process.env.PUBLISHED_PACKAGES);
            assert.deepEqual(published, [{ name, version }]);
            const request = { sha: process.env.GITHUB_SHA, version, tag: "v" + version };
            writeFileSync(join(process.env.RUNNER_TEMP, "docs-deploy-request.json"), JSON.stringify(request));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, "Published " + name + "@" + version + " from " + request.sha + ". Tag: " + request.tag + "\n");
          '
      - name: Request released docs deployment
        if: steps.publish.outputs.published == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-deploy-request
          path: ${{ runner.temp }}/docs-deploy-request.json
          if-no-files-found: error
