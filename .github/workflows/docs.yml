name: Docs

# Builds the documentation site and publishes it to the `docs` branch, which GitHub Pages serves.
# The branch holds only the built site, and each publish replaces it.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "skills/**"
      - "docs/.vitepress/**"
      - "scripts/prepare-docs.js"
      - "site-assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - name: Publish to the docs branch
        working-directory: site
        run: |
          git init --initial-branch=docs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --message "docs: build from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" docs
