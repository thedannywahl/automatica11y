name: Docs

# Builds the documentation site and publishes it to the `docs` branch, which GitHub Pages serves.
# The branch holds only the built site, and each publish replaces it.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "skills/**"
      - "docs/.vitepress/**"
      - "docs/public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run docs:build
      - name: Set custom domain
        run: printf 'automatica11y.dev\n' > site/CNAME
      - name: Publish to the docs branch
        working-directory: site
        run: |
          git init --initial-branch=docs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --message "docs: build from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" docs
