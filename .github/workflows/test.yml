name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The runner has Google Chrome. This also puts the headless shell in the cache, so the tests find a browser either way.
      - run: npx playwright-core install --with-deps --only-shell chromium
      - run: npm run lint
      - run: npm test
